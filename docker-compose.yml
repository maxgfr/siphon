# Everything in one container: the API and the interface, on one origin, so
# there is no CORS to configure and no second thing to deploy.
#
#   docker compose up -d        then open http://localhost:8000
#
# This pulls a prebuilt image rather than building one, so there is nothing to
# compile and nothing to wait for. To build from source instead — which is what
# you want when you are changing the server — add the build overlay:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  siphon:
    image: ghcr.io/maxgfr/siphon:latest
    pull_policy: always
    ports:
      - "8000:8000"
    environment:
      # Who may call the API from another origin. This container serves the
      # frontend too, and its own page needs no entry; the default adds the
      # hosted page, https://maxgfr.github.io. Name yours if you host a copy.
      # Not "*" without a key: any site open in your browser could use it.
      # ALLOWED_ORIGINS: "https://maxgfr.github.io"
      # Set this the moment the server is reachable from outside your network.
      # AUTH_TOKEN: "change-me"
      # This computer's address on your Wi-Fi, for Settings → Test to show as
      # the one to open on a phone. The container cannot see it for itself.
      # LAN_URL: "http://192.168.1.42:8000"
      MAX_CONCURRENT_JOBS: "3"
      JOB_TTL_SECONDS: "3600"
    volumes:
      - downloads:/tmp/siphon
    restart: unless-stopped

volumes:
  downloads:
