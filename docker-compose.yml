# Everything in one container: the API and the interface, on one origin, so
# there is no CORS to configure and no second thing to deploy.
#
#   docker compose up -d        then open http://localhost:8000
#
# This pulls a prebuilt image rather than building one, so there is nothing to
# compile and nothing to wait for. To build from source instead — which is what
# you want when you are changing the server — add the build overlay:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  siphon:
    image: ghcr.io/maxgfr/siphon:latest
    pull_policy: always
    ports:
      - "8000:8000"
    environment:
      # Same-origin by default, because this container serves the frontend too.
      # Add your GitHub Pages URL here if you use the hosted frontend instead.
      ALLOWED_ORIGINS: "*"
      # Set this the moment the server is reachable from outside your network.
      # AUTH_TOKEN: "change-me"
      MAX_CONCURRENT_JOBS: "3"
      JOB_TTL_SECONDS: "3600"
    volumes:
      - downloads:/tmp/siphon
    restart: unless-stopped

volumes:
  downloads:
