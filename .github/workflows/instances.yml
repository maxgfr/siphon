name: Refresh the Invidious instance list

# The app on Pages reaches YouTube through public Invidious instances, and
# which of those are up changes week to week. This keeps web/instances.json
# in step with the list the Invidious project publishes itself
# (https://docs.invidious.io/instances/), so a fresh visitor starts from
# today's list rather than the one committed months ago. The app still probes
# every address before using it; this only decides which ones it tries.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: instances
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/instances.mjs
      - id: diff
        run: |
          if git diff --quiet -- web/instances.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/instances.json
          git commit -m "chore: refresh the Invidious instance list"
          git push
      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # Pages deploy is asked for directly — otherwise the fresh list would sit
      # on main and never reach the site.
      - if: steps.diff.outputs.changed == 'true'
        run: gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ github.token }}
