name: Refresh and measure the public instance lists

# The app on Pages can reach YouTube through a public Invidious, Piped or
# cobalt instance, and which of those answer a web page changes week to week.
# This keeps web/instances.json in step with the lists the projects publish
# (docs.invidious.io, piped-instances.kavin.rocks, the list behind
# cobalt.directory) and, the part a visitor sees, measures each instance as
# the page would use it: the video endpoint with an Origin header, then the
# first bytes of the media it names. Only the ones that answer go into
# `open`, which is what the settings sheet offers as chips — none on a day
# none did. The app still probes every address before using it.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: instances
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # With the Origin of this repository's page, as relay-config.yml sends it.
      - run: node scripts/instances.mjs
        env:
          SIPHON_ORIGIN: ${{ vars.SIPHON_ORIGIN || format('https://{0}.github.io', github.repository_owner) }}
      - id: diff
        run: |
          if git diff --quiet -- web/instances.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/instances.json
          git commit -m "chore: the public instances, refreshed and measured"
          # main may have moved while this ran (a merge, the other daily job);
          # without this the push is refused and the day's measurement is lost.
          git pull --rebase origin main
          git push
      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # Pages deploy is asked for directly — otherwise the fresh list would sit
      # on main and never reach the site.
      - if: steps.diff.outputs.changed == 'true'
        run: gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ github.token }}
