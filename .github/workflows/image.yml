name: Publish the server image

# The README's first recommendation is to run the server on your own machine.
# Building it there means cloning the repo and waiting several minutes, which is
# a lot to ask of someone who just wants to download a video. Publishing the
# image turns all of that into one `docker run`.
#
# Both architectures are built on purpose: arm64 is not an edge case here, it is
# every Apple Silicon Mac and every Raspberry Pi — the machines people actually
# leave running at home.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "scripts/vendor_ffmpeg.py"
      - ".github/workflows/image.yml"
    tags: ["v*"]
  # yt-dlp is what YouTube breaks, and it releases about monthly. An image
  # built once and pulled months later carries a stale extractor, which is the
  # most common "it stopped working" there is for tools like this one. So the
  # image is rebuilt weekly from the same sources with `yt-dlp[default]` at
  # its newest, and `docker compose pull` is the whole update.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # arm64 is emulated on an amd64 runner, so it needs binfmt registered.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is enough for the repository's own package: no secret to
      # set up, which is the point of using GHCR rather than Docker Hub.
      #
      # The package inherits this repository's visibility, so on a public repo
      # it is publicly pullable as soon as it is pushed — verified by fetching
      # the manifest with an anonymous ghcr.io token. On a private fork it will
      # be private too, and making it public is Packages -> siphon -> Package
      # settings -> Change visibility, which needs a personal token and so is
      # not something this workflow can do for itself.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # The newest yt-dlp on PyPI, for the build argument that keys the pip
      # layer (see the Dockerfile). Without it that layer came from the cache
      # whenever the base images had not moved, and the weekly rebuild
      # republished the yt-dlp it already had. PyPI not answering is no
      # reason to trust the cache: the run's id stands in, and pip runs.
      - id: ytdlp
        run: |
          latest=$(curl -fsS --retry 3 https://pypi.org/pypi/yt-dlp/json | jq -r '.info.version // empty') || true
          echo "latest=${latest:-unknown-${{ github.run_id }}}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            YTDLP_LATEST=${{ steps.ytdlp.outputs.latest }}
          # Without a cache every push re-installs ffmpeg and the Python
          # dependencies twice over, once per architecture. With it, the
          # Python ones are reinstalled when yt-dlp releases, and only then.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # What the rebuild is for, checked in what was pushed: the yt-dlp inside
      # is the one PyPI named. Its metadata, not `yt-dlp --version`, which
      # writes 2026.08.19 where PyPI writes 2026.8.19.
      - if: ${{ !startsWith(steps.ytdlp.outputs.latest, 'unknown-') }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          LATEST: ${{ steps.ytdlp.outputs.latest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
          got=$(docker run --rm --entrypoint python "$image" -c "import importlib.metadata as m; print(m.version('yt-dlp'))")
          echo "yt-dlp in the image: $got; newest on PyPI: $LATEST"
          if [ "$got" != "$LATEST" ]; then
            echo "::error::the image just pushed carries yt-dlp $got, not the newest ($LATEST)"
            exit 1
          fi
