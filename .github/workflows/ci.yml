name: CI

# Two defects reached main before this file existed, and both would have been
# caught in seconds: a requirements.txt pip could not resolve, and a service
# worker no test had ever run because every test used plain HTTP. Nothing was
# executing on a pull request. Now something is.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Seconds. Runs on every change, gates every merge.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Installing from the file, not a hand-picked subset, is the whole point:
      # the file has to resolve, or the Dockerfile cannot build.
      - run: pip install -r server/requirements.txt pytest httpx
      # Some of the server's tests run the real yt-dlp against a real ffmpeg:
      # where ffmpeg connects, and what a clip cuts, no stub can show.
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pytest server/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  # A few minutes. The app in a real browser: downloads, the service worker
  # over HTTPS, a first visit to a host with no API, the settings sheet.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      # The converter beside the app, as deployed — the suites load it from
      # the app's own origin, which is what a visitor gets.
      - run: python3 scripts/vendor_ffmpeg.py
      - run: npm run test:e2e
      - run: npm run test:deployed
      - run: npm run test:bridge
      - run: npm run test:split

  # A few minutes. The image as it is published, started the way it starts:
  # as root, through the entrypoint, down to the app user. What only the
  # image can get wrong is checked in it — the entrypoint once left HOME at
  # /root, which the app user cannot write, and yt-dlp's cache (the YouTube
  # player it otherwise fetches and solves again for every job) went nowhere.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f server/Dockerfile -t siphon:ci .
      - name: The app user can keep yt-dlp's cache
        run: |
          docker run --rm -i siphon:ci python - <<'EOF'
          import os, yt_dlp
          assert os.getuid() != 0, "the server is still root"
          with yt_dlp.YoutubeDL({"quiet": True, "no_warnings": True}) as ydl:
              ydl.cache.store("siphon-ci", "probe", 1)
              assert ydl.cache.load("siphon-ci", "probe") == 1, f"yt-dlp cannot keep a cache under HOME={os.environ.get('HOME')}"
          print("cache kept, HOME =", os.environ.get("HOME"))
          EOF
      # A shell left as PID 1 ignores SIGTERM: every stop sat out the grace
      # period and ended in a SIGKILL, exit 137, with no shutdown at all.
      - name: A stop reaches the server, which shuts down cleanly
        run: |
          docker run -d --name stop-check siphon:ci
          sleep 8
          start=$(date +%s)
          docker stop stop-check
          took=$(( $(date +%s) - start ))
          code=$(docker inspect stop-check -f '{{.State.ExitCode}}')
          docker rm stop-check
          echo "stopped in ${took}s, exit code ${code}"
          test "$took" -lt 5 && test "$code" = 0

  # Informative, not gating. A runner is a datacentre IP, and whether YouTube
  # answers one on a given day is YouTube's decision, not this code's. What it
  # must never be is silent: the log names the client that got through, or
  # the exact refusal, and the job summary says which it was.
  #
  # The measurement steps carry `continue-on-error`, not the job: a job that
  # tolerates its own failure still ends up marked failed, and that red mark
  # lands on every commit of main for an answer that is YouTube's. The step
  # keeps its red cross in the log; the job, and so the commit, stay green.
  youtube:
    runs-on: ubuntu-latest
    # The harness has its own 20-minute watchdog; this is the ceiling for
    # everything around it (installs, the probe, a hung browser), so an
    # informative job can never sit on a runner for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      # The Piped path gets one public instance; the Invidious path walks the
      # bundled list in web/instances.json, which is what a fresh visitor to
      # the Pages deploy starts from. Instances come and go and YouTube blocks
      # them in waves; a failure here is information about them today, which
      # is exactly what this job is for.
      # First, what YouTube's API says to a bare request from this runner:
      # one hand-built call per client, no browser, no relay, no library. A
      # red below is read against this instead of guessed at.
      - id: probe
        run: node tests/innertube-probe.mjs
        continue-on-error: true
        env:
          SIPHON_PIPED_URL: https://pipedapi.kavin.rocks
      - id: browser
        run: npm run test:youtube
        continue-on-error: true
        env:
          SIPHON_PIPED_URL: https://pipedapi.kavin.rocks
      # The answer, where it is read without opening a log.
      - run: |
          {
            echo "## YouTube from the browser mode, from this runner, today"
            echo
            echo "| measurement | outcome |"
            echo "|---|---|"
            echo "| InnerTube, one hand-built call per client | ${{ steps.probe.outcome }} |"
            echo "| the app: the relay, Piped, the bundled Invidious list | ${{ steps.browser.outcome }} |"
            echo
            echo "A failure is YouTube's answer to a datacentre IP today, not this code's; the step's log quotes every refusal. The job stays green so that main is not marked red for it."
          } >> "$GITHUB_STEP_SUMMARY"

  # Informative, like `youtube`: the server half against the real site, from
  # this checkout, on a runner — the README's first recommendation, measured.
  # First plain, then with the community proof-of-origin provider beside it
  # (the docker-compose.potoken.yml arrangement), because a datacentre IP is
  # exactly the case that provider exists for. The log says what yt-dlp said,
  # client by client, in both cases. The step tolerates the failure, not the
  # job, for the reason given above `youtube`.
  server-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt bgutil-ytdlp-pot-provider
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      # The JavaScript runtime yt-dlp solves YouTube's signature challenge
      # with, as the Docker image ships it.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The provider as the compose overlay runs it: the image, its port.
      - run: docker run -d --name potoken -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest
      - id: server
        run: npm run test:server
        continue-on-error: true
        env:
          POT_PROVIDER_URL: http://127.0.0.1:4416
      - run: |
          {
            echo "## YouTube from the server, from this runner, today"
            echo
            echo "| measurement | outcome |"
            echo "|---|---|"
            echo "| yt-dlp, plain and then with the proof-of-origin provider | ${{ steps.server.outcome }} |"
            echo
            echo "A failure is YouTube's answer to a datacentre IP without a session, not this code's; the step's log quotes yt-dlp client by client. The job stays green so that main is not marked red for it."
          } >> "$GITHUB_STEP_SUMMARY"
