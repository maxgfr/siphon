name: Deploy frontend to GitHub Pages

# Only web/ is published. The server half is a container you run yourself —
# Pages cannot host it, which is the whole reason the frontend can point at an
# address you configure.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/vendor_ffmpeg.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # ONE-TIME MANUAL STEP: Settings -> Pages -> Source: "GitHub Actions".
      #
      # enablement: true asks the action to create the Pages site itself, which
      # it can do in some repositories. It could not here: the workflow's
      # GITHUB_TOKEN may deploy to Pages but not create the site, and the run
      # fails with "Create Pages site failed. Resource not accessible by
      # integration". Creating it needs repository admin, once, by hand.
      #
      # Left at true because it is free: once the site exists the action finds
      # it and never attempts creation again.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The converter, beside the page: same-origin, nothing to configure.
      - run: python3 scripts/vendor_ffmpeg.py

      # web/config.json is what the relay-config workflow measured and
      # committed. The owner's own relay (the SIPHON_RELAY_URL variable)
      # overrides it here, so setting the variable is enough to take effect on
      # the next deploy without waiting for the daily measurement. It is
      # written as the measurement writes it: an address typed with no scheme
      # is given https://, which the page needs, and one that is no address
      # stops the deploy with the reason.
      - run: |
          if [ -n "${SIPHON_RELAY_URL}" ]; then
            node --input-type=module -e 'import { readFileSync, writeFileSync } from "node:fs";import { ownRelay } from "./scripts/relay-config.mjs";let relay;try{relay=ownRelay(process.env.SIPHON_RELAY_URL)}catch(error){console.error(error.message);process.exit(1)}const f="web/config.json";const c=JSON.parse(readFileSync(f,"utf8"));c.relay=relay;c.relayKind="own";writeFileSync(f,JSON.stringify(c,null,2)+"\n")'
          fi
        env:
          SIPHON_RELAY_URL: ${{ vars.SIPHON_RELAY_URL }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
