name: Deploy frontend to GitHub Pages

# Only web/ is published. The server half is a container you run yourself —
# Pages cannot host it, which is the whole reason the frontend can point at an
# address you configure.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/vendor_ffmpeg.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # ONE-TIME MANUAL STEP: Settings -> Pages -> Source: "GitHub Actions".
      #
      # enablement: true asks the action to create the Pages site itself, which
      # it can do in some repositories. It could not here: the workflow's
      # GITHUB_TOKEN may deploy to Pages but not create the site, and the run
      # fails with "Create Pages site failed. Resource not accessible by
      # integration". Creating it needs repository admin, once, by hand.
      #
      # Left at true because it is free: once the site exists the action finds
      # it and never attempts creation again.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The converter, beside the page: same-origin, nothing to configure.
      - run: python3 scripts/vendor_ffmpeg.py

      # The site's own relay, if its owner set one: Settings → Secrets and
      # variables → Actions → Variables → SIPHON_RELAY_URL. Every visitor then
      # gets YouTube through it with nothing to configure. Unset, the file
      # stays as committed and the app looks for a public instance instead.
      - run: printf '{ "relay": "%s" }\n' "${SIPHON_RELAY_URL}" > web/config.json
        env:
          SIPHON_RELAY_URL: ${{ vars.SIPHON_RELAY_URL }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
