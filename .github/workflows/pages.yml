name: Deploy frontend to GitHub Pages

# Only web/ is published. The server half is a container you run yourself —
# Pages cannot host it, which is the whole reason the frontend can point at an
# address you configure.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # enablement: true turns Pages on for the repository the first time this
      # runs. Without it the action only *looks up* an existing Pages site, and
      # a repo that has never had one fails with "Get Pages site failed" — which
      # is exactly how this workflow failed on its first run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
