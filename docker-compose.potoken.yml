# Last resort for YouTube, when the client ladder and cookies both come up
# against a login wall.
#
#   docker compose -f docker-compose.yml -f docker-compose.potoken.yml up -d
#
# YouTube's newer clients want a proof-of-origin token minted by its own
# JavaScript. yt-dlp cannot produce one itself, so this runs the community
# provider beside it: siphon points every extraction at the sidecar, and the
# plugin baked into the image picks the tokens up.
#
# Costs a container and some memory. Try cookies first — they are free and fix
# the same failure more often.
#
# Every later compose command needs the same files, the update included. A
# bare `docker compose up -d` recreates siphon without POT_PROVIDER_URL and
# leaves the provider running for nothing; compose only mentions an orphan
# container. Naming the files once in a .env beside them makes every command
# read them (on Windows the separator is ; rather than :):
#
#   echo COMPOSE_FILE=docker-compose.yml:docker-compose.potoken.yml >> .env
services:
  potoken:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    init: true
    restart: unless-stopped

  siphon:
    environment:
      POT_PROVIDER_URL: "http://potoken:4416"
    depends_on:
      - potoken
