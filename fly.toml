# Deploy: fly launch --no-deploy && fly secrets set AUTH_TOKEN=$(openssl rand -hex 16) && fly deploy
app = "siphon"
primary_region = "cdg"

[build]
  dockerfile = "server/Dockerfile"

[env]
  ALLOWED_ORIGINS = "*"
  MAX_CONCURRENT_JOBS = "2"
  JOB_TTL_SECONDS = "1800"
  DOWNLOAD_DIR = "/data/downloads"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Downloads are long-lived requests and the job outlives them anyway, but a
  # machine that stops mid-download loses the file — so keep one warm.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      path = "/api/health"
      interval = "30s"
      timeout = "5s"

# Finished files live here until the TTL sweeps them. Without a volume they sit
# in the container's writable layer and vanish on every restart.
[[mounts]]
  source = "downloads"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
